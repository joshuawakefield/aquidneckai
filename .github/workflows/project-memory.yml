name: Local project checks and memory

on:
  pull_request:
    branches: [aqai-local-index]
  push:
    branches: [aqai-local-index]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked project dependencies
        run: npm ci
      - name: Run offline project report and change-record checks
        env:
          CHECK_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before || github.sha }}
        run: |
          if [[ "$CHECK_BASE" =~ ^0{40}$ ]]; then CHECK_BASE="$(git rev-parse HEAD)"; fi
          node scripts/project-check-report.mjs --base "$CHECK_BASE" --run-checks --format json
